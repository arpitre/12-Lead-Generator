<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set a new password — 12-Lead Generator</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body>

<main class="auth">
  <div class="auth-brand">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 40 16" width="40" height="16"><polyline points="0,8 7,8 9,3 12,13 15,8 22,8 24,6 26,10 28,8 40,8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </span>
    <span>
      <strong>12-Lead Generator</strong>
      <small>Paramedic interpretation practice</small>
    </span>
  </div>

  <div class="auth-card">
    <h1>Set a new password</h1>
    <p class="lede">Choose a password you do not use anywhere else.</p>

    <p id="message" class="msg" hidden></p>

    <form id="formReset" novalidate>
      <div class="field">
        <label for="password">New password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required>
        <span class="hint">At least 10 characters.</span>
      </div>
      <div class="field">
        <label for="confirm">Confirm new password</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Save new password</button>
    </form>

    <p class="auth-foot"><a href="/login">Back to sign in</a></p>
  </div>

  <p class="auth-note">Simulated tracings for education. Not for clinical use.</p>
</main>

<script>
(function () {
  'use strict';

  var form = document.getElementById('formReset');
  var message = document.getElementById('message');

  function say(text, kind) {
    message.textContent = text;
    message.className = 'msg msg-' + (kind || 'error');
    message.hidden = false;
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    message.hidden = true;

    var password = document.getElementById('password').value;
    var confirm = document.getElementById('confirm').value;

    // Checked here purely so a typo costs a moment rather than a round trip;
    // the length rule is enforced again on the server.
    if (password.length < 10) return say('Use a password of at least 10 characters.');
    if (password !== confirm) return say('Those two passwords do not match.');

    var button = form.querySelector('button[type="submit"]');
    button.disabled = true;
    button.textContent = 'Saving…';

    fetch('/api/reset', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ password: password })
    }).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (data) {
        return { ok: response.ok, body: data || {} };
      });
    }).catch(function () {
      return { ok: false, body: { error: 'Network error. Check your connection and try again.' } };
    }).then(function (result) {
      if (result.ok) {
        // The reset cleared every session, so signing in again is the next step.
        location.href = '/login?reset=1';
        return;
      }
      button.disabled = false;
      button.textContent = 'Save new password';
      if (result.body.expired) {
        location.href = '/login?error=' + encodeURIComponent(result.body.error);
        return;
      }
      say(result.body.error || 'Could not set that password.');
    });
  });
})();
</script>
</body>
</html>
